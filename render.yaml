services:
  - type: web
    name: frostfire-ai
    runtime: docker
    plan: free
    # The Dockerfile builds both the frontend and backend from the repository root.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # Configure only after the existing live database has been exported and
      # the migration has passed validation; never deploy an empty replacement.
      - key: DATABASE_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: frostfire
      - key: DATABASE_POOL_SIZE
        value: 8
      # OPENAI_API_KEY is optional; add only for explicitly enabled cloud features.
      - key: AI_INTERPRET_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_INTERPRET_MODEL
        value: nex-agi/nex-n2.5-mini:free
      - key: OPENROUTER_INTERPRET_FALLBACK_MODEL
        value: openrouter/free
      - key: OPENROUTER_ENDPOINT
        value: https://openrouter.ai/api/v1/chat/completions
      - key: JWT_SECRET
        generateValue: true
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: CORS_ORIGINS
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ADZUNA_COUNTRY
        value: gb
      - key: RECRUITMENT_REFRESH_MINUTES
        value: 1440
      - key: RECRUITMENT_WEB_SEARCH_ENABLED
        value: false
      - key: RECRUITMENT_WEB_SEARCH_MODEL
        value: gpt-5.4-mini
      - key: RECRUITMENT_WEB_SEARCH_INTERVAL_MINUTES
        value: 1440
      - key: RECRUITMENT_WEB_SEARCH_MAX_TOOL_CALLS
        value: 10
      - key: FUTURE_RADAR_ENABLED
        value: true
      - key: FUTURE_RADAR_DEFAULT_INTERVAL_MINUTES
        value: 1440
      - key: FUTURE_RADAR_CLOSE_CONFIRMATIONS
        value: 2
      - key: FUTURE_RADAR_MAX_WORKERS
        value: 1
      - key: FUTURE_RADAR_AI_MODEL
        value: gpt-5.4-mini
      - key: RECRUITMENT_INGEST_TOKEN
        generateValue: true
      - key: FUTURE_RADAR_SYNC_TOKEN
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://frostfire-ai.onrender.com
      - key: ENABLE_FUTURE_RADAR_MCP
        value: false
      - key: ADMIN_DASHBOARD_TOKEN
        sync: false
