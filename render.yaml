services:
  - type: web
    name: frostfire-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: /app/backend/data/ai_chat.db
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: CORS_ORIGINS
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ADZUNA_COUNTRY
        value: gb
      - key: RECRUITMENT_REFRESH_MINUTES
        value: 30
      - key: RECRUITMENT_INGEST_TOKEN
        generateValue: true
