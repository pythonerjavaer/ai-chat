services:
  - type: web
    name: frostfire-ai
    runtime: docker
    plan: free
    # The Dockerfile builds both the frontend and backend from the repository root.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: /app/backend/data/ai_chat.db
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: CORS_ORIGINS
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ADZUNA_COUNTRY
        value: gb
      - key: RECRUITMENT_REFRESH_MINUTES
        value: 30
      - key: RECRUITMENT_WEB_SEARCH_ENABLED
        value: true
      - key: RECRUITMENT_WEB_SEARCH_MODEL
        value: gpt-5.4-mini
      - key: RECRUITMENT_WEB_SEARCH_INTERVAL_MINUTES
        value: 360
      - key: RECRUITMENT_WEB_SEARCH_MAX_TOOL_CALLS
        value: 10
      - key: FUTURE_RADAR_ENABLED
        value: true
      - key: FUTURE_RADAR_DEFAULT_INTERVAL_MINUTES
        value: 30
      - key: FUTURE_RADAR_CLOSE_CONFIRMATIONS
        value: 2
      - key: FUTURE_RADAR_MAX_WORKERS
        value: 4
      - key: FUTURE_RADAR_AI_MODEL
        value: gpt-5.4-mini
      - key: RECRUITMENT_INGEST_TOKEN
        generateValue: true
      - key: ADMIN_DASHBOARD_TOKEN
        sync: false
