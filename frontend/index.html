<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Chat</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a0f;
      --panel: #10131b;
      --panel-2: #171b25;
      --line: #292f3d;
      --text: #f4f6fb;
      --muted: #8e96a8;
      --accent: #7c9cff;
      --accent-2: #a87cff;
      --danger: #ff6b75;
      --success: #55d69e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 0%, rgba(124, 156, 255, 0.13), transparent 32rem),
        radial-gradient(circle at 95% 100%, rgba(168, 124, 255, 0.1), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select { font: inherit; }
    button { color: inherit; }
    .hidden { display: none !important; }

    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .auth-card {
      width: min(430px, 100%);
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(16, 19, 27, 0.92);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(20px);
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 { margin: 10px 0 8px; font-size: 34px; }
    .auth-card p { margin: 0 0 28px; color: var(--muted); line-height: 1.6; }
    .field { display: grid; gap: 8px; margin-bottom: 16px; }
    .field label { color: #c9ceda; font-size: 13px; }

    .field input,
    .composer input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0b0e14;
      color: var(--text);
      outline: none;
    }

    .field input { padding: 13px 14px; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 156, 255, 0.12); }

    .primary,
    .ghost,
    .icon-button {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-2);
      cursor: pointer;
      transition: 160ms ease;
    }

    .primary {
      width: 100%;
      padding: 13px 16px;
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-weight: 700;
    }

    .primary:hover, .ghost:hover, .icon-button:hover { transform: translateY(-1px); filter: brightness(1.08); }
    button:disabled { cursor: not-allowed; opacity: 0.55; transform: none !important; }
    .auth-switch { margin-top: 18px; text-align: center; color: var(--muted); font-size: 13px; }
    .link-button { padding: 0; border: 0; background: none; color: var(--accent); cursor: pointer; }
    .error-text { min-height: 20px; margin: 10px 0 0; color: var(--danger); font-size: 13px; }

    .app-shell {
      height: 100vh;
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
    }

    .sidebar {
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: rgba(13, 16, 23, 0.93);
      backdrop-filter: blur(20px);
    }

    .brand { padding: 24px 22px 16px; }
    .brand strong { display: block; font-size: 20px; letter-spacing: 0.02em; }
    .brand span { color: var(--muted); font-size: 12px; }
    .sidebar-actions { padding: 0 16px 14px; }
    .new-chat { width: 100%; padding: 11px 14px; text-align: left; }
    .workspace-picker { display: grid; gap: 7px; padding: 0 16px 14px; }
    .workspace-picker label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .workspace-picker select {
      width: 100%;
      padding: 11px 36px 11px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-2);
      color: var(--text);
      outline: none;
      cursor: pointer;
    }
    .workspace-picker select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 156, 255, 0.12); }

    .section-title {
      padding: 12px 20px 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .session-list { min-height: 100px; flex: 1; overflow-y: auto; padding: 0 10px; }
    .session-row, .document-row {
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 10px;
      color: #c8cedb;
    }

    .session-row { padding: 3px; margin-bottom: 3px; }
    .session-row.active { background: rgba(124, 156, 255, 0.12); color: white; }
    .session-open { min-width: 0; flex: 1; padding: 9px; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .delete-button { flex: none; border: 0; background: none; color: #6f7789; cursor: pointer; font-size: 16px; }
    .delete-button:hover { color: var(--danger); }

    .knowledge { border-top: 1px solid var(--line); padding-bottom: 12px; }
    .upload-label { display: block; margin: 0 16px 9px; padding: 10px; border: 1px dashed #3b4354; border-radius: 10px; color: var(--muted); font-size: 12px; text-align: center; cursor: pointer; }
    .upload-label:hover { border-color: var(--accent); color: var(--text); }
    .document-list { max-height: 130px; overflow-y: auto; padding: 0 12px; }
    .document-row { padding: 7px 5px; font-size: 12px; }
    .document-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .user-bar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--line); }
    .avatar { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); font-weight: 800; }
    .username { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .logout { padding: 7px 9px; background: transparent; color: var(--muted); }

    .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .topbar { height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; border-bottom: 1px solid var(--line); background: rgba(8, 10, 15, 0.72); backdrop-filter: blur(18px); }
    .topbar-title { font-weight: 700; }
    .title-stack { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .workspace-indicator { padding: 4px 8px; border: 1px solid rgba(124,156,255,.38); border-radius: 999px; color: #b8c7ff; font-size: 10px; white-space: nowrap; }
    .capabilities { display: flex; gap: 8px; }
    .capability { padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 11px; }
    .mobile-menu { display: none; padding: 7px 10px; }

    .chat-window { min-height: 0; flex: 1; overflow-y: auto; padding: 28px clamp(18px, 6vw, 82px); }
    .welcome { max-width: 700px; margin: min(14vh, 100px) auto 0; text-align: center; }
    .welcome-mark { width: 56px; height: 56px; display: grid; place-items: center; margin: 0 auto 18px; border: 1px solid #3a4253; border-radius: 18px; background: linear-gradient(145deg, #202638, #11151e); font-size: 22px; }
    .welcome h2 { margin: 0 0 10px; font-size: clamp(24px, 4vw, 38px); }
    .welcome p { margin: 0; color: var(--muted); line-height: 1.7; }
    .workspace-boundary { max-width: 620px; margin: 12px auto 0 !important; color: #717b90 !important; font-size: 12px; }
    .quick-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 24px auto 0; text-align: left; }
    .quick-action { padding: 12px 14px; border: 1px solid var(--line); border-radius: 13px; background: rgba(23,27,37,.72); color: #cbd2df; cursor: pointer; line-height: 1.45; }
    .quick-action:hover { border-color: rgba(124,156,255,.55); background: rgba(35,42,58,.9); }

    .message { max-width: 850px; margin: 0 auto 22px; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
    .message.user { grid-template-columns: minmax(0, 1fr) 34px; }
    .message.user .message-body { grid-column: 1; grid-row: 1; justify-self: end; background: #1b2231; }
    .message.user .message-avatar { grid-column: 2; background: #2b3344; }
    .message-avatar { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: linear-gradient(145deg, #202638, #11151e); font-size: 12px; font-weight: 800; }
    .message-body { max-width: min(760px, 100%); padding: 13px 15px; border: 1px solid var(--line); border-radius: 15px; background: var(--panel); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; }
    .message-meta { display: flex; flex-wrap: wrap; gap: 6px; max-width: 850px; margin: -14px auto 22px 46px; }
    .tag { padding: 4px 8px; border: 1px solid #343c4d; border-radius: 999px; color: var(--muted); font-size: 10px; }
    .typing::after { content: ""; display: inline-block; width: 6px; height: 14px; margin-left: 3px; background: var(--accent); vertical-align: -2px; animation: blink 0.8s infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .composer-wrap { padding: 14px clamp(18px, 6vw, 82px) 22px; background: linear-gradient(transparent, rgba(8, 10, 15, 0.96) 24%); }
    .composer { max-width: 850px; margin: 0 auto; display: flex; gap: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 17px; background: var(--panel); box-shadow: 0 14px 40px rgba(0, 0, 0, 0.28); }
    .composer input { flex: 1; padding: 11px 12px; border: 0; background: transparent; box-shadow: none; }
    .send-button { width: 44px; height: 44px; border: 0; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); font-weight: 800; }
    .composer-hint { max-width: 850px; margin: 7px auto 0; color: #646d80; font-size: 11px; text-align: center; }

    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 20; max-width: min(380px, calc(100vw - 44px)); padding: 12px 15px; border: 1px solid #5b2931; border-radius: 12px; background: #251216; color: #ffb4ba; box-shadow: 0 14px 40px rgba(0,0,0,.35); }

    @media (max-width: 820px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 10; width: min(290px, 86vw); transform: translateX(-105%); transition: transform 180ms ease; box-shadow: 20px 0 60px rgba(0,0,0,.45); }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu { display: inline-block; }
      .capabilities { display: none; }
      .topbar { padding: 0 16px; }
      .chat-window { padding-inline: 16px; }
      .composer-wrap { padding-inline: 12px; }
      .quick-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section id="auth-page" class="auth-page">
    <div class="auth-card">
      <div class="eyebrow">Persistent AI workspace</div>
      <h1 id="auth-title">欢迎回来</h1>
      <p id="auth-description">登录后继续你的对话和个人知识库。</p>
      <form id="auth-form">
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" minlength="3" maxlength="50" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required />
        </div>
        <button id="auth-submit" class="primary" type="submit">登录</button>
        <div id="auth-error" class="error-text"></div>
      </form>
      <div class="auth-switch">
        <span id="auth-switch-copy">还没有账号？</span>
        <button id="auth-switch" class="link-button" type="button">创建账号</button>
      </div>
    </div>
  </section>

  <div id="app-shell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <strong>AI Research Workspace</strong>
        <span>OpenAI · 专业文档智能平台</span>
      </div>
      <div class="workspace-picker">
        <label for="workspace-select">当前工作区</label>
        <select id="workspace-select" aria-label="选择工作区"></select>
      </div>
      <div class="sidebar-actions">
        <button id="new-chat" class="ghost new-chat" type="button">＋ 新对话</button>
      </div>
      <div class="section-title">对话记录</div>
      <div id="session-list" class="session-list"></div>

      <section class="knowledge">
        <div id="knowledge-title" class="section-title">工作区资料</div>
        <label id="upload-label" class="upload-label" for="document-input">上传 PDF / DOCX / TXT 等资料</label>
        <input id="document-input" type="file" accept=".pdf,.docx,.txt,.md,.csv,.json,text/plain,text/markdown,application/json,text/csv,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />
        <div id="document-list" class="document-list"></div>
      </section>

      <div class="user-bar">
        <div id="avatar" class="avatar">U</div>
        <div id="current-username" class="username"></div>
        <button id="logout" class="ghost logout" type="button">退出</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-stack">
          <button id="mobile-menu" class="ghost mobile-menu" type="button">☰</button>
          <div id="conversation-title" class="topbar-title">新对话</div>
          <span id="workspace-indicator" class="workspace-indicator">通用文档</span>
        </div>
        <div class="capabilities">
          <span class="capability">Memory</span>
          <span class="capability">RAG</span>
          <span class="capability">Agent</span>
          <span class="capability">Streaming</span>
        </div>
      </header>

      <div id="chat-window" class="chat-window"></div>

      <div class="composer-wrap">
        <form id="chat-form" class="composer">
          <input id="message-input" maxlength="12000" autocomplete="off" placeholder="发送消息，或询问已上传的资料…" />
          <button id="send-button" class="send-button" type="submit" aria-label="发送">↑</button>
        </form>
        <div id="composer-hint" class="composer-hint">回复由 OpenAI API 生成；对话和知识库保存在本地 SQLite。</div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    const API_BASE = "http://127.0.0.1:8000/api";
    const state = {
      token: localStorage.getItem("ai_chat_token"),
      user: null,
      sessionId: null,
      sessions: [],
      documents: [],
      workspaces: [],
      workspace: localStorage.getItem("ai_chat_workspace") || "general",
      authMode: "login",
      sending: false,
    };

    const elements = {
      authPage: document.getElementById("auth-page"),
      appShell: document.getElementById("app-shell"),
      authForm: document.getElementById("auth-form"),
      authTitle: document.getElementById("auth-title"),
      authDescription: document.getElementById("auth-description"),
      authSubmit: document.getElementById("auth-submit"),
      authError: document.getElementById("auth-error"),
      authSwitch: document.getElementById("auth-switch"),
      authSwitchCopy: document.getElementById("auth-switch-copy"),
      username: document.getElementById("username"),
      password: document.getElementById("password"),
      currentUsername: document.getElementById("current-username"),
      avatar: document.getElementById("avatar"),
      workspaceSelect: document.getElementById("workspace-select"),
      workspaceIndicator: document.getElementById("workspace-indicator"),
      sessionList: document.getElementById("session-list"),
      documentList: document.getElementById("document-list"),
      documentInput: document.getElementById("document-input"),
      knowledgeTitle: document.getElementById("knowledge-title"),
      uploadLabel: document.getElementById("upload-label"),
      chatWindow: document.getElementById("chat-window"),
      chatForm: document.getElementById("chat-form"),
      messageInput: document.getElementById("message-input"),
      sendButton: document.getElementById("send-button"),
      conversationTitle: document.getElementById("conversation-title"),
      composerHint: document.getElementById("composer-hint"),
      sidebar: document.getElementById("sidebar"),
      toast: document.getElementById("toast"),
    };

    async function api(path, options = {}) {
      const headers = new Headers(options.headers || {});
      if (state.token) headers.set("Authorization", `Bearer ${state.token}`);
      if (options.body && !(options.body instanceof FormData)) {
        headers.set("Content-Type", "application/json");
      }
      const response = await fetch(API_BASE + path, { ...options, headers });
      if (response.status === 401 && path !== "/auth/login") logout();
      if (!response.ok) {
        let detail = `HTTP ${response.status}`;
        try { detail = (await response.json()).detail || detail; } catch (_) {}
        throw new Error(detail);
      }
      return response.status === 204 ? null : response.json();
    }

    function showToast(message) {
      elements.toast.textContent = message;
      elements.toast.classList.remove("hidden");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => elements.toast.classList.add("hidden"), 4000);
    }

    function setAuthMode(mode) {
      state.authMode = mode;
      const registering = mode === "register";
      elements.authTitle.textContent = registering ? "创建账号" : "欢迎回来";
      elements.authDescription.textContent = registering
        ? "创建你的私有 AI 工作空间。"
        : "登录后继续你的对话和个人知识库。";
      elements.authSubmit.textContent = registering ? "注册并进入" : "登录";
      elements.authSwitchCopy.textContent = registering ? "已经有账号？" : "还没有账号？";
      elements.authSwitch.textContent = registering ? "登录" : "创建账号";
      elements.password.autocomplete = registering ? "new-password" : "current-password";
      elements.authError.textContent = "";
    }

    async function authenticate(event) {
      event.preventDefault();
      elements.authError.textContent = "";
      elements.authSubmit.disabled = true;
      try {
        const result = await api(`/auth/${state.authMode}`, {
          method: "POST",
          body: JSON.stringify({
            username: elements.username.value.trim(),
            password: elements.password.value,
          }),
        });
        state.token = result.access_token;
        state.user = result.user;
        localStorage.setItem("ai_chat_token", state.token);
        await enterApp();
      } catch (error) {
        elements.authError.textContent = error.message;
      } finally {
        elements.authSubmit.disabled = false;
      }
    }

    async function enterApp() {
      elements.authPage.classList.add("hidden");
      elements.appShell.classList.remove("hidden");
      elements.currentUsername.textContent = state.user.username;
      elements.avatar.textContent = state.user.username.slice(0, 1).toUpperCase();
      await loadWorkspaces();
      await Promise.all([loadSessions(), loadDocuments()]);
      newConversation();
    }

    function logout() {
      localStorage.removeItem("ai_chat_token");
      state.token = null;
      state.user = null;
      state.sessionId = null;
      elements.appShell.classList.add("hidden");
      elements.authPage.classList.remove("hidden");
      elements.password.value = "";
    }

    async function loadSessions() {
      state.sessions = await api("/sessions");
      renderSessions();
    }

    function activeWorkspace() {
      return state.workspaces.find((item) => item.id === state.workspace) || {
        id: "general",
        label: "通用文档",
        description: "围绕个人资料进行可追溯的问答与总结。",
        boundary: "请核对关键事实与来源。",
        quick_actions: [],
      };
    }

    async function loadWorkspaces() {
      state.workspaces = await api("/workspaces");
      if (!state.workspaces.some((item) => item.id === state.workspace)) {
        state.workspace = "general";
      }
      elements.workspaceSelect.replaceChildren();
      state.workspaces.forEach((workspace) => {
        const option = document.createElement("option");
        option.value = workspace.id;
        option.textContent = workspace.label;
        elements.workspaceSelect.appendChild(option);
      });
      elements.workspaceSelect.value = state.workspace;
      renderWorkspaceChrome();
    }

    function renderWorkspaceChrome() {
      const workspace = activeWorkspace();
      elements.workspaceSelect.value = state.workspace;
      elements.workspaceIndicator.textContent = workspace.label;
      elements.knowledgeTitle.textContent = `${workspace.label}资料`;
      elements.uploadLabel.textContent = `上传到“${workspace.label}” · PDF / DOCX / TXT 等`;
      elements.messageInput.placeholder = state.workspace === "legal"
        ? "询问条款、义务、期限、风险或合规要求…"
        : state.workspace === "finance"
          ? "询问财务指标、期间变化、假设或风险…"
          : "发送消息，或询问已上传的资料…";
      elements.composerHint.textContent = `${workspace.boundary} 回复由 OpenAI API 生成，资料保存在本地 SQLite。`;
    }

    async function changeWorkspace() {
      state.workspace = elements.workspaceSelect.value;
      localStorage.setItem("ai_chat_workspace", state.workspace);
      state.sessionId = null;
      renderWorkspaceChrome();
      await loadDocuments();
      newConversation();
    }

    function renderSessions() {
      elements.sessionList.replaceChildren();
      const workspaceSessions = state.sessions.filter(
        (session) => (session.workspace || "general") === state.workspace,
      );
      if (!workspaceSessions.length) {
        const empty = document.createElement("div");
        empty.className = "section-title";
        empty.textContent = "当前工作区还没有对话";
        elements.sessionList.appendChild(empty);
        return;
      }
      workspaceSessions.forEach((session) => {
        const row = document.createElement("div");
        row.className = "session-row" + (session.id === state.sessionId ? " active" : "");
        const open = document.createElement("button");
        open.className = "session-open";
        open.textContent = session.title;
        open.title = session.title;
        open.addEventListener("click", () => openSession(session));
        const remove = document.createElement("button");
        remove.className = "delete-button";
        remove.textContent = "×";
        remove.title = "删除对话";
        remove.addEventListener("click", () => deleteSession(session.id));
        row.append(open, remove);
        elements.sessionList.appendChild(row);
      });
    }

    function renderWelcome() {
      const workspace = activeWorkspace();
      elements.chatWindow.replaceChildren();
      const welcome = document.createElement("div");
      welcome.className = "welcome";
      const mark = document.createElement("div");
      mark.className = "welcome-mark";
      mark.textContent = state.workspace === "legal" ? "§" : state.workspace === "finance" ? "↗" : "✦";
      const title = document.createElement("h2");
      title.textContent = workspace.label;
      const description = document.createElement("p");
      description.textContent = workspace.description;
      const boundary = document.createElement("p");
      boundary.className = "workspace-boundary";
      boundary.textContent = workspace.boundary;
      const actions = document.createElement("div");
      actions.className = "quick-actions";
      (workspace.quick_actions || []).forEach((copy) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "quick-action";
        button.textContent = copy;
        button.addEventListener("click", () => {
          elements.messageInput.value = copy;
          elements.messageInput.focus();
        });
        actions.appendChild(button);
      });
      welcome.append(mark, title, description, boundary, actions);
      elements.chatWindow.appendChild(welcome);
    }

    function newConversation() {
      state.sessionId = null;
      elements.conversationTitle.textContent = `${activeWorkspace().label} · 新对话`;
      renderWorkspaceChrome();
      renderSessions();
      renderWelcome();
      elements.messageInput.focus();
      elements.sidebar.classList.remove("open");
    }

    async function openSession(session) {
      try {
        const messages = await api(`/sessions/${session.id}/messages`);
        state.sessionId = session.id;
        state.workspace = session.workspace || "general";
        localStorage.setItem("ai_chat_workspace", state.workspace);
        renderWorkspaceChrome();
        await loadDocuments();
        elements.conversationTitle.textContent = session.title;
        elements.chatWindow.replaceChildren();
        messages.forEach((message) => appendMessage(message.role, message.content));
        renderSessions();
        elements.sidebar.classList.remove("open");
      } catch (error) {
        showToast(error.message);
      }
    }

    async function deleteSession(sessionId) {
      if (!confirm("确定删除这个对话及其消息吗？")) return;
      try {
        await api(`/sessions/${sessionId}`, { method: "DELETE" });
        if (state.sessionId === sessionId) newConversation();
        await loadSessions();
      } catch (error) {
        showToast(error.message);
      }
    }

    async function loadDocuments() {
      state.documents = await api(`/documents?workspace=${encodeURIComponent(state.workspace)}`);
      elements.documentList.replaceChildren();
      if (!state.documents.length) {
        const empty = document.createElement("div");
        empty.className = "section-title";
        empty.textContent = "还没有工作区资料";
        elements.documentList.appendChild(empty);
        return;
      }
      state.documents.forEach((documentItem) => {
        const row = document.createElement("div");
        row.className = "document-row";
        const name = document.createElement("span");
        name.className = "document-name";
        name.textContent = documentItem.name;
        name.title = `${documentItem.name} · ${documentItem.chunk_count} 个片段`;
        const remove = document.createElement("button");
        remove.className = "delete-button";
        remove.textContent = "×";
        remove.title = "移除文档";
        remove.addEventListener("click", () => deleteDocument(documentItem.id));
        row.append(name, remove);
        elements.documentList.appendChild(row);
      });
    }

    async function uploadDocument() {
      const file = elements.documentInput.files[0];
      if (!file) return;
      const data = new FormData();
      data.append("file", file);
      data.append("workspace", state.workspace);
      try {
        showToast("正在建立文档索引…");
        await api("/documents", { method: "POST", body: data });
        await loadDocuments();
        showToast(`文档已加入“${activeWorkspace().label}”`);
      } catch (error) {
        showToast(error.message);
      } finally {
        elements.documentInput.value = "";
      }
    }

    async function deleteDocument(documentId) {
      if (!confirm("确定从知识库移除这个文档吗？")) return;
      try {
        await api(`/documents/${documentId}`, { method: "DELETE" });
        await loadDocuments();
      } catch (error) {
        showToast(error.message);
      }
    }

    function appendMessage(role, text, pending = false) {
      const welcome = elements.chatWindow.querySelector(".welcome");
      if (welcome) welcome.remove();
      const wrapper = document.createElement("div");
      wrapper.className = `message ${role === "user" ? "user" : "assistant"}`;
      const avatar = document.createElement("div");
      avatar.className = "message-avatar";
      avatar.textContent = role === "user" ? "YOU" : "AI";
      const body = document.createElement("div");
      body.className = "message-body" + (pending ? " typing" : "");
      body.textContent = text;
      wrapper.append(avatar, body);
      elements.chatWindow.appendChild(wrapper);
      elements.chatWindow.scrollTop = elements.chatWindow.scrollHeight;
      return { wrapper, body };
    }

    function appendTags(tags) {
      if (!tags.length) return;
      const meta = document.createElement("div");
      meta.className = "message-meta";
      [...new Set(tags)].forEach((label) => {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = label;
        meta.appendChild(tag);
      });
      elements.chatWindow.appendChild(meta);
    }

    function parseSseBlock(block) {
      let event = "message";
      const data = [];
      block.split("\n").forEach((line) => {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        if (line.startsWith("data:")) data.push(line.slice(5).trimStart());
      });
      return { event, data: data.length ? JSON.parse(data.join("\n")) : {} };
    }

    async function sendMessage(event) {
      event.preventDefault();
      const message = elements.messageInput.value.trim();
      if (!message || state.sending) return;

      state.sending = true;
      elements.sendButton.disabled = true;
      elements.messageInput.value = "";
      appendMessage("user", message);
      const pending = appendMessage("assistant", "", true);
      const tags = [];
      let receivedText = false;

      try {
        const response = await fetch(API_BASE + "/chat/stream", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${state.token}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            message,
            session_id: state.sessionId,
            workspace: state.workspace,
          }),
        });
        if (!response.ok) {
          let detail = `HTTP ${response.status}`;
          try { detail = (await response.json()).detail || detail; } catch (_) {}
          throw new Error(detail);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done }).replace(/\r\n/g, "\n");
          let boundary;
          while ((boundary = buffer.indexOf("\n\n")) >= 0) {
            const block = buffer.slice(0, boundary);
            buffer = buffer.slice(boundary + 2);
            if (!block.trim()) continue;
            const packet = parseSseBlock(block);
            if (packet.event === "meta") {
              state.sessionId = packet.data.session_id;
              (packet.data.sources || []).forEach((source) => {
                const page = source.page ? ` · 第 ${source.page} 页` : "";
                tags.push(`来源 · ${source.name}${page}`);
              });
            } else if (packet.event === "token") {
              if (!receivedText) {
                pending.body.textContent = "";
                pending.body.classList.remove("typing");
                receivedText = true;
              }
              pending.body.textContent += packet.data.content;
              elements.chatWindow.scrollTop = elements.chatWindow.scrollHeight;
            } else if (packet.event === "tool") {
              tags.push(`工具 · ${packet.data.name}`);
            } else if (packet.event === "done") {
              (packet.data.tools_used || []).forEach((name) => tags.push(`工具 · ${name}`));
            } else if (packet.event === "error") {
              throw new Error(packet.data.detail || "流式请求失败");
            }
          }
          if (done) break;
        }
        pending.body.classList.remove("typing");
        if (!pending.body.textContent) pending.body.textContent = "模型没有返回文本。";
        appendTags(tags);
        await loadSessions();
        const active = state.sessions.find((item) => item.id === state.sessionId);
        if (active) elements.conversationTitle.textContent = active.title;
      } catch (error) {
        pending.body.classList.remove("typing");
        pending.body.textContent = `请求失败：${error.message}`;
      } finally {
        state.sending = false;
        elements.sendButton.disabled = false;
        elements.messageInput.focus();
      }
    }

    elements.authForm.addEventListener("submit", authenticate);
    elements.authSwitch.addEventListener("click", () => setAuthMode(state.authMode === "login" ? "register" : "login"));
    document.getElementById("logout").addEventListener("click", logout);
    document.getElementById("new-chat").addEventListener("click", newConversation);
    document.getElementById("mobile-menu").addEventListener("click", () => elements.sidebar.classList.toggle("open"));
    elements.workspaceSelect.addEventListener("change", changeWorkspace);
    elements.documentInput.addEventListener("change", uploadDocument);
    elements.chatForm.addEventListener("submit", sendMessage);

    (async function bootstrap() {
      if (!state.token) return;
      try {
        state.user = await api("/auth/me");
        await enterApp();
      } catch (_) {
        logout();
      }
    })();
  </script>
</body>
</html>
